# بيولّد نسخ مخففة من صور المنتجات في images/opt/ (الأصول في images/ زي ما هي)
# بيشتغل يدوي فقط من تبويب Actions (Run workflow) - شغّله تاني لما تضيف صور جديدة.
name: Generate optimized images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Generate images/opt from images
        run: |
          python3 - <<'PYEOF'
          import os
          from PIL import Image
          src, dst = "images", "images/opt"
          os.makedirs(dst, exist_ok=True)
          made = 0
          for f in sorted(os.listdir(src)):
              p = os.path.join(src, f)
              if not os.path.isfile(p):
                  continue
              low = f.lower()
              if not low.endswith((".jpg", ".jpeg", ".png", ".webp")):
                  continue
              im = Image.open(p)
              out = os.path.join(dst, f)
              if f == "logo.png":
                  im.thumbnail((184, 184), Image.LANCZOS)
                  im.save(out, optimize=True)
              elif low.endswith((".jpg", ".jpeg")):
                  im = im.convert("RGB")
                  im.thumbnail((480, 480), Image.LANCZOS)
                  im.save(out, "JPEG", quality=80, optimize=True, progressive=True)
              elif low.endswith(".webp"):
                  im = im.convert("RGB")
                  im.thumbnail((480, 480), Image.LANCZOS)
                  im.save(out, "WEBP", quality=80, method=6)
              else:
                  im.thumbnail((480, 480), Image.LANCZOS)
                  im.save(out, optimize=True)
              made += 1
          print("generated", made, "optimized images")
          PYEOF
      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/opt
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Generate optimized storefront images in images/opt (originals preserved)"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
